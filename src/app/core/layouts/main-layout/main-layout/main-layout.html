<div class="min-h-screen bg-canvas">
  @if (drawerOpen()) {
    <div
      class="fixed inset-0 z-40 bg-scrim animate-fade-in lg:hidden"
      (click)="closeDrawer()"
      aria-hidden="true"
    ></div>
  }

  <aside
    class="fixed inset-y-0 inset-s-0 z-50 flex w-64 flex-col bg-sidebar border-e border-sidebar-line transition-transform duration-200 max-lg:shadow-sheet lg:translate-x-0"
    [class.max-lg:-translate-x-full]="!drawerOpen()"
    [class.max-lg:rtl:translate-x-full]="!drawerOpen()"
    aria-label="Main navigation"
  >
    <div class="flex items-center gap-3 px-4 py-5">
      <!-- <span
        class="grid size-10 shrink-0 place-items-center rounded-md bg-linear-to-br from-primary-600 to-accent text-white"
        aria-hidden="true"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
          <path d="M6 12h12" />
          <path d="M10 6h2" />
          <path d="M10 9h2" />
          <path d="M10 15h2" />
          <path d="M10 18h2" />
        </svg>
      </span> -->
      <img src="logo.png" alt="Logo" class="h-6 lg:h-10" />
      <span class="font-display text-lg font-extrabold tracking-tight text-fg-inverted">HRMS</span>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-2">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-item-active"
          class="nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary-500/40"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="shrink-0"
            aria-hidden="true"
          >
            <path [attr.d]="item.icon" />
          </svg>
          <span>{{ item.label | translate }}</span>
        </a>
      }
    </nav>

    <div class="border-t border-sidebar-line p-3">
      <app-user-menu />
    </div>
  </aside>

  <div class="flex min-h-screen flex-col lg:ps-64">
    <header
      class="sticky top-0 z-30 flex h-14 items-center justify-between border-b border-line bg-surface px-4 lg:hidden"
    >
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="grid size-10 place-items-center rounded-md border border-line bg-surface text-fg transition hover:bg-sunken focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ring/30"
          (click)="toggleDrawer()"
          aria-label="{{ 'nav.openMenu' | translate }}"
          [attr.aria-expanded]="drawerOpen()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="4" x2="20" y1="6" y2="6" />
            <line x1="4" x2="20" y1="12" y2="12" />
            <line x1="4" x2="20" y1="18" y2="18" />
          </svg>
        </button>
        <span class="font-display text-base font-extrabold text-fg">HRMS</span>
      </div>
    </header>

    <main class="flex-1">
      <div class="mx-auto max-w-7xl px-4 py-6 lg:px-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
