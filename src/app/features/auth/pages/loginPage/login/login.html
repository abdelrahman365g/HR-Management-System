<div class="card p-8">
  <div class="mb-6">
    <h1 class="font-display text-2xl font-extrabold tracking-tight text-fg">
      {{ 'auth.signInTitle' | translate }}
    </h1>
    <p class="mt-1 text-sm text-muted">{{ 'auth.signInSubtitle' | translate }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div>
      <label class="field-label mb-1.5 block" for="email">{{ 'auth.email' | translate }}</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        dir="ltr"
        [class.field-input]="true"
        [class.field-input-error]="false"
      />
    </div>

    <div>
      <label class="field-label mb-1.5 block" for="password">{{ 'auth.password' | translate }}</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        dir="ltr"
        class="field-input"
      />
    </div>

    @if (errorMessage()) {
      <p class="banner-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="submitting()" class="btn-primary mt-2 w-full">
      {{ (submitting() ? 'auth.signingIn' : 'auth.signIn') | translate }}
    </button>
  </form>
</div>
